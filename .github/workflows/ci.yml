name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - beta
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: npm run check

      - name: Build development userscript
        run: npm run build:dev

      - name: Stage development artifact
        run: |
          mkdir -p artifacts/dev
          cp dist/wme-place-harmonizer-row-edition.dev.user.js artifacts/dev/

      - name: Build beta userscript
        run: npm run build:beta

      - name: Stage beta artifact
        run: |
          mkdir -p artifacts/beta
          cp dist/wme-place-harmonizer-row-edition.beta.user.js artifacts/beta/

      - name: Build production userscript
        run: npm run build:prod

      - name: Stage production artifact
        run: |
          mkdir -p artifacts/prod
          cp dist/wme-place-harmonizer-row-edition.user.js artifacts/prod/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userscript-builds
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish beta artifact to beta branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/wme-place-harmonizer-row-edition.beta.user.js
          if git diff --cached --quiet -- dist/wme-place-harmonizer-row-edition.beta.user.js; then
            echo "Beta artifact unchanged; skipping publish."
          else
            git commit -m "chore: publish beta userscript [skip ci]"
            git push origin HEAD:beta
          fi
