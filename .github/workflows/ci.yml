name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - beta
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATA_REPO_REF: ${{ github.ref_name == 'main' && 'main' || github.base_ref == 'main' && 'main' || 'dev' }}
    defaults:
      run:
        working-directory: wme-place-harmonizer-row-edition

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: wme-place-harmonizer-row-edition

      - name: Check out companion data repository
        uses: actions/checkout@v5
        with:
          repository: GigaaG/wme-place-harmonizer-row-data
          ref: ${{ env.DATA_REPO_REF }}
          path: wme-place-harmonizer-row-data

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: wme-place-harmonizer-row-edition/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests
        run: npm run check

      - name: Build development userscript
        run: npm run build:dev

      - name: Stage development artifact
        run: |
          mkdir -p artifacts/dev
          cp dist/wme-place-harmonizer-row-edition.dev.user.js artifacts/dev/

      - name: Build beta userscript
        run: npm run build:beta

      - name: Stage beta artifact
        run: |
          mkdir -p artifacts/beta
          cp dist/wme-place-harmonizer-row-edition.beta.user.js artifacts/beta/

      - name: Build production userscript
        run: npm run build:prod

      - name: Stage production artifact
        run: |
          mkdir -p artifacts/prod
          cp dist/wme-place-harmonizer-row-edition.user.js artifacts/prod/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userscript-builds
          path: wme-place-harmonizer-row-edition/artifacts/**
          if-no-files-found: error
          retention-days: 14

  publish-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wme-place-harmonizer-row-edition

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: wme-place-harmonizer-row-edition

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: userscript-builds
          path: artifact-download

      - name: Publish beta artifact to beta-dist branch
        run: |
          PUBLISH_BRANCH="beta-dist"
          PUBLISH_FILE="dist/wme-place-harmonizer-row-edition.user.js"
          SOURCE_FILE="../artifact-download/beta/wme-place-harmonizer-row-edition.beta.user.js"

          if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PUBLISH_BRANCH"
            git checkout -B "$PUBLISH_BRANCH" "origin/$PUBLISH_BRANCH"
          else
            git checkout --orphan "$PUBLISH_BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          mkdir -p dist
          cp "$SOURCE_FILE" "$PUBLISH_FILE"
          git add "$PUBLISH_FILE"
          if git diff --cached --quiet; then
            echo "beta-dist artifact unchanged; skipping publish."
          else
            git commit -m "ci(beta): publish userscript [skip ci]"
            git push origin HEAD:"$PUBLISH_BRANCH"
          fi

  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wme-place-harmonizer-row-edition

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: wme-place-harmonizer-row-edition

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: userscript-builds
          path: artifact-download

      - name: Publish stable artifact to stable-dist branch
        run: |
          PUBLISH_BRANCH="stable-dist"
          PUBLISH_FILE="dist/wme-place-harmonizer-row-edition.user.js"
          SOURCE_FILE="../artifact-download/prod/wme-place-harmonizer-row-edition.user.js"

          if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PUBLISH_BRANCH"
            git checkout -B "$PUBLISH_BRANCH" "origin/$PUBLISH_BRANCH"
          else
            git checkout --orphan "$PUBLISH_BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          mkdir -p dist
          cp "$SOURCE_FILE" "$PUBLISH_FILE"
          git add "$PUBLISH_FILE"
          if git diff --cached --quiet; then
            echo "stable-dist artifact unchanged; skipping publish."
          else
            git commit -m "ci(main): publish stable userscript [skip ci]"
            git push origin HEAD:"$PUBLISH_BRANCH"
          fi
